spring:
  application:
    name: calendar

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:3306/calendar?serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        http-only: true

app:
  # URL frontendu, kam se přesměruje po úspěšném přihlášení
  frontend-url: ${FRONTEND_URL:https://calendar-app.vercel.app}
  # Google "sub" hodnoty povolených účtů (csv), doplní se po prvním přihlášení (viz krok 4a plánu)
  allowed-google-subs: ${ALLOWED_GOOGLE_SUBS:}
